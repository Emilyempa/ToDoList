<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>ToDo</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <meta name="description" content="A simple and user-friendly ToDo List application to track tasks and manage your day.">
  

<body class="top">
    <header class="header"></header>
    <main id="main">
        <h1>My ToDo</h1>
        <h2 id="completedCount"> 0 completed</h2>
        <input type="text" id="input" name="input">
        <button id="submit" type="button">OK</button>
        <p id="alerting"></p>
        <div class="MyTasks">
            <ul id="tasks">
            </ul>
            <button id="deleteAll"><img src="./pics/delete.svg" alt="Delete"> Delete All Tasks</button>
        </div>
    </main>
    <script type="text/javascript" src='index.js'></script>
</body>

</html>
